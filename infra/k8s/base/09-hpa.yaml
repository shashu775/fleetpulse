# Needs the metrics-server addon:  minikube addons enable metrics-server
# Without it the HPA reports <unknown>/60% forever and never scales.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: consignment-service
  namespace: fleetpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: consignment-service
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # % of the CPU *request* (50m), not of the node. This is why the
          # request in 05-consignment.yaml has to be accurate: set it too high
          # and the HPA never triggers, too low and it scales on noise.
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30     # react quickly to load
    scaleDown:
      stabilizationWindowSeconds: 300    # descend slowly, avoid flapping
# Prove it with the simulator, in-cluster:
#   Terminal 1:  kubectl get hpa -n fleetpulse -w
#   Terminal 2:  kubectl run simulator -n fleetpulse --rm -it --restart=Never `
#                  --image=fleetpulse/simulator:latest --image-pull-policy=IfNotPresent `
#                  --env="CONSIGNMENT_URL=http://consignment-service:8000" `
#                  --env="DISPATCH_URL=http://dispatch-service:8000" -- --parcels 200
