apiVersion: apps/v1
kind: StatefulSet
metadata:  
       namespace: {{.Release.Namespace}}
       name: {{.Values.postgres.name}}
spec:
      serviceName: {{.Values.postgres.name}}
      replicas: {{.Values.postgres.replica}}
      selector: 
         matchLabels: {app: {{.Values.postgres.name}}}
      template: 
         metadata: 
             labels: {app: {{.Values.postgres.name}}}
         spec:
             containers:
             - name: {{.Values.postgres.name}}
               image: {{.Values.postgres.image}}
               ports: 
               - containerPort: {{.Values.postgres.targetPort}}
               resources:
                  requests: {memory: "{{.Values.postgres.memreq}}", cpu: "{{.Values.postgres.cpureq}}"}
                  limits:   {memory: "{{.Values.postgres.memlim}}", cpu : "{{.Values.postgres.cpulim}}"}
               livenessProbe:
                  exec:
                     command: ["pg_isready", "-U", "fleetpulse", "-d", "fleetpulse"]
                  initialDelaySeconds: 5
                  periodSeconds: 5
               env:
                - name: POSTGRES_USER
                  value: {{.Values.postgres.user}}
                - name: POSTGRES_DB
                  value: {{.Values.postgres.database}}
                - name: POSTGRES_PASSWORD
                  valueFrom:
                     secretKeyRef: {name: {{.Release.Namespace}}-secrets, key: POSTGRES_PASSWORD}
                - name : PGDATA
                  value : /var/lib/postgresql/data/pgdata
               volumeMounts:
                - name: data
                  mountPath: /var/lib/postgresql/data
                - name: init
                  mountPath: /docker-entrypoint-initdb.d
             volumes:
              - name: init
                configMap:
                  name: postgres-init-scripts
      volumeClaimTemplates:
            - metadata:
                name: data
              spec:
                accessModes: [ "ReadWriteOnce" ]
                resources:
                  requests:
                    storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
    namespace: {{.Release.Namespace}}
    name: {{.Values.postgres.name}}
spec:
    selector: {app: {{.Values.postgres.name}}}
    clusterIP: None
    ports:
        - port: {{.Values.postgres.port}}
          targetPort: {{.Values.postgres.targetPort}}