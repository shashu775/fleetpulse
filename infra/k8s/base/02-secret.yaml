# /!\ DO NOT PUT A REAL PASSWORD HERE. Kubernetes Secrets are only
# base64-encoded, NOT encrypted. Anyone who can read the manifest -- or run
# `kubectl get secret -o yaml` -- can read the password.
#
# Create it from the command line instead:
#
#   kubectl create secret generic fleetpulse-secrets --namespace fleetpulse `
#     --from-literal=POSTGRES_PASSWORD="PASSWORD" `
#     --from-literal=DATABASE_URL="postgresql://fleetadmin:PASSWORD@postgres:5432/fleetpulse"
#
# This file is committed only as documentation of the expected SHAPE. It is
# NOT applied by `kubectl apply -f infra/k8s/base/` unless you delete the
# placeholder below and mean it.
apiVersion: v1
kind: Secret
metadata:
  name: fleetpulse-secrets
  namespace: fleetpulse
type: Opaque
stringData:
  # The password appears TWICE, in two shapes: the Postgres image wants the
  # bare value, the services want a full connection URL. Compose hides this by
  # interpolating ${POSTGRES_PASSWORD} into DATABASE_URL; Kubernetes Secrets
  # have no interpolation, so the two must be kept in sync BY HAND. Setting one
  # and forgetting the other is a `password authentication failed` loop that
  # looks like a networking problem.
  POSTGRES_PASSWORD: "CHANGEME"
  DATABASE_URL: "postgresql://fleetadmin:CHANGEME@postgres:5432/fleetpulse"
