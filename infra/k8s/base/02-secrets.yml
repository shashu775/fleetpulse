apiVersion : v1
kind: Secret
metadata: 
    namespace: fleetpulse
    name: fleetpulse-secrets
type: Opaque
stringData:
    POSTGRES_USER: fleetpulse
    POSTGRES_PASSWORD: fleetpulse
    # Host is the Service name in 03-postgres.yml -- "postgres-service", NOT
    # "postgresql-service". Only the scheme at the front is spelled postgresql.
    DATABASE_URL: postgresql://fleetpulse:fleetpulse@postgres-service:5432/fleetpulse