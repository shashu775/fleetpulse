imagePullPolicy: IfNotPresent

loglevel: INFO

postgres:
   name: postgres
   user: fleetpulse
   password: fleetpulse
   database: fleetpulse
   image: postgres:16-alpine
   replica: 1
   memreq : 125Mi
   cpureq: 125m
   memlim: 250Mi
   cpulim: 250m
   port: 5432
   targetPort: 5432

redis:
   name: redis
   image: redis:6.2.6
   replicas: 1
   targetPort: 6379
   port: 6379
   memlim: 512Mi
   cpulim: 500m
   memreq: 256Mi
   cpureq: 250m
   url: redis://redis-service:6379/0

consignment: 
   name: consignment
   image: travel2024/consignment:latest
   replicas: 1
   targetPort: 8000
   port: 8000
   memlim: 512Mi
   cpulim: 500m
   memreq: 256Mi
   cpureq: 250m
   url: http://consignment-service:8000

dispatch:
    name: dispatch
    image: travel2024/dispatch:latest
    replicas: 1
    targetPort: 8000
    port: 8000
    memlim: 512Mi
    cpulim: 500m
    memreq: 256Mi
    cpureq: 250m

web:
    name: web
    image: travel2024/web:latest
    replicas: 1
    targetPort: 80
    port: 80
    memlim: 512Mi
    cpulim: 500m
    memreq: 256Mi
    cpureq: 250m

hpa:
   min: 2
   max: 8

job:
    name: db-migrate
