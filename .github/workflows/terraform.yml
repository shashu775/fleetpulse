# FleetPulse -- Terraform CI/CD for the EKS cluster.
#
# The plan IS the review artifact. A PR touching infra/terraform/** gets its
# `terraform plan` posted as a comment; merging to code2 applies exactly that
# plan -- not a freshly computed one nobody looked at.
#
# ---------------------------------------------------------------------------
# ONE-TIME SETUP (do these by hand before the first run)
# ---------------------------------------------------------------------------
#
# 1. State bucket. Created outside Terraform on purpose: Terraform must never be
#    able to delete the record of what it has to delete.
#
#      aws s3 mb s3://fleetpulse-tfstate-<account-id> --region us-east-1
#      aws s3api put-bucket-versioning \
#        --bucket fleetpulse-tfstate-<account-id> \
#        --versioning-configuration Status=Enabled
#
#    Versioning is what lets you recover from a corrupted or truncated state.
#    Then set the same bucket name in infra/terraform/environments/dev/versions.tf.
#
# 2. GitHub OIDC provider + IAM role in the AWS account. This replaces
#    long-lived AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets entirely --
#    the runner exchanges a short-lived GitHub token for temporary AWS creds.
#    It is the same trust-policy mechanism as the IRSA block in main.tf, with
#    GitHub as the identity provider instead of the cluster.
#
#      aws iam create-open-id-connect-provider \
#        --url https://token.actions.githubusercontent.com \
#        --client-id-list sts.amazonaws.com
#
#    Role trust policy -- note it pins the BRANCH, not just the repo. Pinning
#    only "repo:shashu775/fleetpulse:*" would let any branch, including one
#    pushed to a fork, assume this role:
#
#      "Condition": {
#        "StringEquals": {
#          "token.actions.githubusercontent.com:aud": "sts.amazonaws.com",
#          "token.actions.githubusercontent.com:sub":
#            "repo:shashu775/fleetpulse:ref:refs/heads/code2"
#        }
#      }
#
# 3. Repo variable AWS_ROLE_ARN -- Settings > Secrets and variables > Actions >
#    Variables. A role ARN is not a secret; a variable keeps it visible in logs
#    when you are debugging why an assume-role failed.
#
# ---------------------------------------------------------------------------
# /!\ code2 is both the working branch AND the deploy branch, so a push changes
#     AWS with no gate in between. To add one, create a GitHub Environment named
#     "dev" with a required reviewer -- the apply job below already targets it,
#     so it will pause for approval as soon as that Environment exists.
# ---------------------------------------------------------------------------

name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [code2]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  id-token: write        # required to request the OIDC token
  contents: read
  pull-requests: write   # required to post the plan comment

concurrency:
  group: terraform-dev
  # NEVER cancel a run in flight. Interrupting `terraform apply` half way through
  # is one of the reliable ways to corrupt state.
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  WORKDIR: infra/terraform/environments/dev

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
          # The wrapper rewrites stdout, which mangles the plan text we post as
          # a comment further down.
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-terraform-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        id: plan
        # Keep going on failure so the comment step below still runs -- a failed
        # plan is exactly when you most want to read the output in the PR.
        continue-on-error: true
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      # -------------------------------------------------------------------
      # Cost guard. main.tf turns off three module defaults that would
      # otherwise bill (NAT Gateway ~$33/mo, KMS key ~$1/mo, CloudWatch log
      # group $15-45/mo). Comments cannot enforce that; this can. A module
      # upgrade that flips a default back on now breaks the build instead of
      # the budget.
      # -------------------------------------------------------------------
      - name: Cost guard -- fail on unexpected billable resources
        if: steps.plan.outcome == 'success'
        run: |
          if grep -nE "^\s*# (aws_nat_gateway|aws_kms_key|aws_cloudwatch_log_group|aws_eip|aws_lb)\." plan.txt; then
            echo "::error::Plan creates billable resources this config is meant to avoid (see the lines above)."
            exit 1
          fi
          echo "No unexpected billable resources in the plan."

      - name: Upload plan
        if: steps.plan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKDIR }}/tfplan
          retention-days: 5

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = process.env.WORKDIR;
            let body;
            try {
              let plan = fs.readFileSync(`${dir}/plan.txt`, 'utf8');
              // GitHub caps comments at 65536 chars.
              const LIMIT = 60000;
              if (plan.length > LIMIT) {
                plan = plan.slice(0, LIMIT) +
                  `\n\n... truncated (${plan.length} chars). Full output in the job log.`;
              }
              body = `### Terraform Plan \`${{ steps.plan.outcome }}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>`;
            } catch (e) {
              body = `### Terraform Plan failed\n\nNo plan output was produced. See the job log.`;
            }
            body += `\n\n<sub>commit \`${context.sha.slice(0,7)}\` · [run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})</sub>\n<!-- terraform-plan-comment -->`;

            // Update the existing comment instead of stacking a new one on every push.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('<!-- terraform-plan-comment -->'));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Apply
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/code2'
    runs-on: ubuntu-latest
    # Create a GitHub Environment named "dev" with a required reviewer to turn
    # this into a manual approval gate. Harmless if the Environment does not exist.
    environment: dev
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-terraform-apply
          aws-region: ${{ env.AWS_REGION }}

      - name: Init
        run: terraform init -input=false

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.WORKDIR }}

      # Applies the SAVED plan, not a fresh one. Re-planning here would apply
      # something nobody reviewed -- and would silently pick up any drift that
      # appeared between the review and the merge.
      - name: Apply
        run: terraform apply -input=false tfplan

      - name: Outputs
        run: terraform output

      - name: Cost reminder
        run: |
          echo "::warning::EKS is now running at ~\$0.15/hr (~\$107/month if left up)."
          echo "::warning::Run the 'Terraform Destroy' workflow when you finish this session."
