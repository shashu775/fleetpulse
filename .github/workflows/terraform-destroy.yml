# FleetPulse -- manual EKS teardown.
#
# Separate workflow, manual trigger, typed confirmation. All three on purpose:
# a one-click destroy button sitting next to a plan button is an accident
# waiting to happen.
#
# Why this exists at all: docs/FleetPulse-Kubernetes.md section 0.1 is blunt
# about it -- EKS is affordable if and ONLY if you destroy the cluster every
# time you finish.
#
#   running ......... ~$0.15/hr   =  ~$0.62 per 4-hour session
#   left up ......... ~$107/month
#
# The teardown is the skill, not the creation.

name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm. Anything else aborts.'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-dev      # shared with terraform.yml -- never destroy during an apply
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  CLUSTER_NAME: fleetpulse-tf

jobs:
  destroy:
    name: Destroy
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: infra/terraform/environments/dev
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'destroy'
        run: |
          echo "::error::Confirmation was '${{ inputs.confirm }}' -- expected 'destroy'. Aborting."
          exit 1

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.4"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-terraform-destroy
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------------------------------------------------
      # Delete Kubernetes-created AWS resources FIRST. Terraform does not know
      # they exist -- an Ingress creates a real ALB and a PVC creates a real EBS
      # volume, neither of which is in Terraform state. Destroy the cluster with
      # those still present and they are orphaned: ~$16/mo for the ALB, ~$1.60/mo
      # per EBS volume, billing quietly forever.
      #
      # Best effort: the cluster may already be gone, which is fine.
      # -------------------------------------------------------------------
      - name: Delete cluster-created AWS resources (ingresses, PVCs)
        continue-on-error: true
        run: |
          if aws eks describe-cluster --name "$CLUSTER_NAME" --region "$AWS_REGION" >/dev/null 2>&1; then
            aws eks update-kubeconfig --name "$CLUSTER_NAME" --region "$AWS_REGION"
            kubectl delete ingress --all --all-namespaces --ignore-not-found
            kubectl delete pvc     --all --all-namespaces --ignore-not-found
            echo "Waiting 60s for AWS to actually delete the load balancers..."
            sleep 60
          else
            echo "Cluster $CLUSTER_NAME not found -- nothing to clean up."
          fi

      - name: Init
        run: terraform init -input=false

      - name: Destroy
        run: terraform destroy -input=false -auto-approve

      # -------------------------------------------------------------------
      # Verify. Do not trust.
      # -------------------------------------------------------------------
      - name: Confirm nothing is left running
        if: always()
        run: |
          echo "--- EKS clusters ---"
          aws eks list-clusters --region "$AWS_REGION"
          echo "--- Load balancers ---"
          aws elbv2 describe-load-balancers --region "$AWS_REGION" \
            --query 'LoadBalancers[].LoadBalancerName' --output text || true
          echo "--- Available (orphaned) EBS volumes ---"
          aws ec2 describe-volumes --region "$AWS_REGION" \
            --filters Name=status,Values=available \
            --query 'Volumes[].{id:VolumeId,size:Size}' --output text || true
          echo
          echo "Empty output above = clean teardown. Anything listed is still billing."
