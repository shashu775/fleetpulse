# Last mile. The only service in the system that calls another service, via
# app/consignment_client.py using CONSIGNMENT_URL from the ConfigMap.
# Dependencies are one-directional: dispatch -> consignment, never the reverse.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch-service
  namespace: fleetpulse
  labels: { app: dispatch-service }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app: dispatch-service }
  template:
    metadata:
      labels: { app: dispatch-service }
    spec:
      containers:
        - name: dispatch
          image: fleetpulse/dispatch-service:latest
          imagePullPolicy: IfNotPresent    # see the note in 05-consignment.yaml
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef: { name: fleetpulse-config }
            - secretRef:    { name: fleetpulse-secrets }
          resources:
            requests: { memory: "96Mi", cpu: "50m" }
            limits:   { memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          # Must not depend on Redis, even though this service treats Redis as a
          # STORE and returns 503 when it is down. A 503 from a GPS endpoint is
          # correct behaviour; restarting the pod would not bring Redis back.
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: dispatch-service
  namespace: fleetpulse
spec:
  type: ClusterIP
  selector: { app: dispatch-service }
  ports:
    - port: 8000
      targetPort: 8000
      name: http
