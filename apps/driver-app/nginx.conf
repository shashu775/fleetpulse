# Serves one app. The gateway proxies to this container and handles /api/*,
# so this config only needs to serve static files.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 512;
}
