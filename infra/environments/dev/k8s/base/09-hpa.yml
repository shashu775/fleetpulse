apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: consignment-service
  namespace: fleetpulse
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: consignment
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300