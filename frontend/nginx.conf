# Single entry point for FleetPulse.
#
# Serves the static UI and proxies both APIs under one origin, which means the
# browser makes same-origin requests and there is no CORS to configure.
#
#   http://localhost/                       the UI
#   http://localhost/api/consignment/v1/... -> consignment-service:8000/api/v1/...
#   http://localhost/api/dispatch/v1/...    -> dispatch-service:8000/api/v1/...

server {
    listen 80;
    server_name _;

    # Never cache the app shell; a stale index.html serving old JS is a
    # confusing class of bug.
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ---- Consignment API -------------------------------------------------
    # The trailing /api/ on proxy_pass rewrites the prefix:
    #   /api/consignment/v1/waybills  ->  /api/v1/waybills
    location /api/consignment/ {
        proxy_pass http://consignment-service:8000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }

    # ---- Dispatch API ----------------------------------------------------
    location /api/dispatch/ {
        proxy_pass http://dispatch-service:8000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout   30s;
    }

    # ---- Health passthrough, used by the UI's status dot -----------------
    location = /health/consignment {
        proxy_pass http://consignment-service:8000/health;
    }

    location = /health/dispatch {
        proxy_pass http://dispatch-service:8000/health;
    }

    # nginx's own liveness, for the container healthcheck
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 512;
}
