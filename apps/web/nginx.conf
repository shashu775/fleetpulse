# FleetPulse web tier -- five apps + API proxy, one nginx.
#
# Every URL that worked with the six-container setup still works:
#
#   Paths      http://localhost/  /merchant/  /hub/  /driver/  /track/  /admin/
#   Hostnames  http://driver.fleetpulse.localhost/   (and the other four)
#   APIs       /api/consignment/*  /api/dispatch/*
#
# WHAT CHANGED: path routes are now plain static file serving instead of a
# proxy hop to another container. Only /api/* is still proxied.
#
# WHY .localhost AND NOT .local: RFC 6762 reserves `.local` for mDNS/Bonjour,
# so those lookups can bypass or race the hosts file and fail intermittently.
# RFC 6761 reserves `.localhost` for loopback, and browsers resolve
# *.localhost internally. Both spellings are accepted so old links keep working.

# Docker's embedded DNS. Without it nginx resolves the API upstreams once at
# boot and keeps a stale IP after any backend restart.
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------------------------------------------------------------------------
# Per-app hostnames.
#
# `root` points at that app's subdirectory, so the app sees itself at "/"
# exactly as it did when it had its own container.
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name merchant.fleetpulse.localhost merchant.fleetpulse.local;
    root /usr/share/nginx/html/merchant;
    location / { try_files $uri $uri/ /index.html; }
    include /etc/nginx/api_locations.conf;
}

server {
    listen 80;
    server_name hub.fleetpulse.localhost hub.fleetpulse.local;
    root /usr/share/nginx/html/hub;
    location / { try_files $uri $uri/ /index.html; }
    include /etc/nginx/api_locations.conf;
}

server {
    listen 80;
    server_name driver.fleetpulse.localhost driver.fleetpulse.local;
    root /usr/share/nginx/html/driver;
    location / { try_files $uri $uri/ /index.html; }
    include /etc/nginx/api_locations.conf;
}

server {
    listen 80;
    server_name track.fleetpulse.localhost track.fleetpulse.local;
    root /usr/share/nginx/html/track;
    location / { try_files $uri $uri/ /index.html; }
    include /etc/nginx/api_locations.conf;
}

server {
    listen 80;
    server_name admin.fleetpulse.localhost admin.fleetpulse.local;
    root /usr/share/nginx/html/admin;
    location / { try_files $uri $uri/ /index.html; }
    include /etc/nginx/api_locations.conf;
}

# ---------------------------------------------------------------------------
# Default server: localhost, fleetpulse.localhost, or any other Host header.
# Launcher at / plus the path-based routes.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;

    # Never cache the app shells -- a stale index.html serving old JS is a
    # confusing class of bug.
    location = / {
        add_header Cache-Control "no-store";
        try_files /index.html =404;
    }
    location = /index.html { add_header Cache-Control "no-store"; }

    # Path routing. No proxy_pass any more: the files are in this image, so
    # these are direct file lookups under `root` above.
    location /merchant/ { try_files $uri $uri/ /merchant/index.html; }
    location /hub/      { try_files $uri $uri/ /hub/index.html; }
    location /driver/   { try_files $uri $uri/ /driver/index.html; }
    location /track/    { try_files $uri $uri/ /track/index.html; }
    location /admin/    { try_files $uri $uri/ /admin/index.html; }

    # Without these, the no-slash form 404s.
    #
    # absolute_redirect off makes nginx emit a RELATIVE Location header.
    # By default it builds an absolute URL from $host and drops the port, so
    # /driver on :8080 would redirect to http://localhost/driver/ -- silently
    # sending you to a different server.
    absolute_redirect off;
    location = /merchant { return 301 /merchant/; }
    location = /hub      { return 301 /hub/; }
    location = /driver   { return 301 /driver/; }
    location = /track    { return 301 /track/; }
    location = /admin    { return 301 /admin/; }

    include /etc/nginx/api_locations.conf;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 512;
}
