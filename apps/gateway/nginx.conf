# FleetPulse gateway.
#
# TWO ways to reach every app, both always available:
#
#   1. A path under localhost -- WORKS WITH ZERO SETUP, start here
#        http://localhost/merchant/  /hub/  /driver/  /track/  /admin/
#
#   2. Its own hostname -- needs ONE hosts-file entry (Admin console -> Apps)
#        http://merchant.fleetpulse.localhost/
#        http://hub.fleetpulse.localhost/
#        http://driver.fleetpulse.localhost/
#        http://track.fleetpulse.localhost/
#        http://admin.fleetpulse.localhost/
#        http://fleetpulse.localhost/        launcher
#
# WHY .localhost AND NOT .local:
#   RFC 6762 reserves `.local` for mDNS/Bonjour. On Windows and macOS a
#   `.local` lookup can be routed to multicast DNS and ignore or race the
#   hosts file, so those names fail intermittently even when configured
#   correctly. RFC 6761 reserves `.localhost` for loopback, and Chrome, Edge
#   and Firefox resolve *.localhost internally without touching the OS
#   resolver at all -- so in a browser these often work with no setup.
#
#   Both suffixes are accepted below so either spelling reaches the app.
#
# Every server block includes api_locations.conf, so whichever hostname you
# use, /api/* is same-origin and there is no CORS anywhere in this project.
#
# This is the same shape as a Kubernetes Ingress: host- AND path-based routing
# to several backends. Moving to k8s is a translation of this file.

# Docker's embedded DNS. Without it nginx resolves upstream service names once
# at boot and keeps a stale IP after any container restart.
resolver 127.0.0.11 valid=10s ipv6=off;

# ---------------------------------------------------------------------------
# Per-app hostnames
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name merchant.fleetpulse.localhost merchant.fleetpulse.local;
    location / { proxy_pass http://merchant-portal/; include /etc/nginx/app_proxy.conf; }
    include /etc/nginx/api_locations.conf;
}

server {
    listen 80;
    server_name hub.fleetpulse.localhost hub.fleetpulse.local;
    location / { proxy_pass http://hub-app/; include /etc/nginx/app_proxy.conf; }
    include /etc/nginx/api_locations.conf;
}

server {
    listen 80;
    server_name driver.fleetpulse.localhost driver.fleetpulse.local;
    location / { proxy_pass http://driver-app/; include /etc/nginx/app_proxy.conf; }
    include /etc/nginx/api_locations.conf;
}

server {
    listen 80;
    server_name track.fleetpulse.localhost track.fleetpulse.local;
    location / { proxy_pass http://customer-portal/; include /etc/nginx/app_proxy.conf; }
    include /etc/nginx/api_locations.conf;
}

server {
    listen 80;
    server_name admin.fleetpulse.localhost admin.fleetpulse.local;
    location / { proxy_pass http://admin-console/; include /etc/nginx/app_proxy.conf; }
    include /etc/nginx/api_locations.conf;
}

# ---------------------------------------------------------------------------
# Default server: localhost, fleetpulse.local, or any other Host header.
# Serves the launcher and keeps the path-based routes working.
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name _;

    location = / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-store";
    }
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store";
    }
    # Needs its own location: every other rule here is an exact match or a
    # proxy, so without this the launcher renders unstyled.
    location = /base.css { root /usr/share/nginx/html; }

    # Path routing. The trailing slash on proxy_pass strips the prefix, so the
    # app container sees "/". Apps use RELATIVE asset paths (./app.js) so they
    # resolve correctly both here and on their own hostname.
    location /merchant/ { proxy_pass http://merchant-portal/; include /etc/nginx/app_proxy.conf; }
    location /hub/      { proxy_pass http://hub-app/;         include /etc/nginx/app_proxy.conf; }
    location /driver/   { proxy_pass http://driver-app/;      include /etc/nginx/app_proxy.conf; }
    location /track/    { proxy_pass http://customer-portal/; include /etc/nginx/app_proxy.conf; }
    location /admin/    { proxy_pass http://admin-console/;   include /etc/nginx/app_proxy.conf; }

    location = /merchant { return 301 /merchant/; }
    location = /hub      { return 301 /hub/; }
    location = /driver   { return 301 /driver/; }
    location = /track    { return 301 /track/; }
    location = /admin    { return 301 /admin/; }

    include /etc/nginx/api_locations.conf;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 512;
}
