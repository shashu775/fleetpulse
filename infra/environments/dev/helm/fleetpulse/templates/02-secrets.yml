apiVersion : v1
kind: Secret
metadata: 
    namespace: {{.Release.Namespace}}
    name: {{.Release.Namespace}}-secrets
type: Opaque
stringData:
    POSTGRES_USER: {{.Values.postgres.user}}
    POSTGRES_PASSWORD: {{.Values.postgres.password}}
    # Host is the Service name in 03-postgres.yml -- "postgres-service", NOT
    # "postgresql-service". Only the scheme at the front is spelled postgresql.
    DATABASE_URL: postgresql://{{.Values.postgres.user}}:{{.Values.postgres.password}}@{{.Values.postgres.name}}:5432/{{.Values.postgres.database}}