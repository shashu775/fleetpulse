apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: fleetpulse
  name: dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dispatch
  template:
    metadata: 
      labels:
        app: dispatch
    spec:
      containers:
        - name: dispatch
          image: travel2024/dispatch:latest
          imagePullPolicy: IfNotPresent      # see the note in 05-consignment.yml
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
            requests:
              memory: "256Mi"
              cpu: "250m"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: fleetpulse-secrets
      initContainers:
            - name: init-dispatch
              image: busybox
              command:
                - sh
                - -c
                - |
                  timeout=300

                  echo "Waiting for Redis..."
                  timeout $timeout sh -c 'until nc -z redis-service 6379; do sleep 5; done'

                  echo "Waiting for PostgreSQL..."
                  timeout $timeout sh -c 'until nc -z postgres-service 5432; do sleep 5; done'

                  echo "Dependencies ready"
---
apiVersion: v1
kind: Service
metadata:
  namespace: fleetpulse
  name: dispatch-service
spec:
  selector:
    app: dispatch 
  ports:
    - protocol: TCP 
      port: 8000
      targetPort: 8000          
