# One entry point, one backend. This replaces the `ports: 80:80` line from
# docker-compose.yml.
#
# Needs the ingress addon:  minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fleetpulse
  namespace: fleetpulse
spec:
  ingressClassName: nginx
  rules:
    # NOTE the hostname differs from Compose on purpose. Compose serves
    # *.fleetpulse.localhost; here it is fleetpulse.test. Both .test and
    # .localhost are RFC 6761 reserved, so neither is wrong -- but both need a
    # hosts-file entry pointing at `minikube ip`. Do not "fix" one to match the
    # other. (Never .local -- RFC 6762 reserves that for mDNS, and those lookups
    # can race or bypass the hosts file.)
    - host: fleetpulse.test
      http:
        paths:
          # Everything. web serves the static apps AND proxies /api/* itself,
          # so there is exactly one backend here.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port: { number: 80 }
# No rewrite-target annotation, and that is the point: the paths the browser
# requests are the paths apps/web/nginx.conf already expects. Rewriting here
# would break the apps' relative asset paths (./api.js, ./base.css) in exactly
# the way absolute paths do under Compose.
#
# The two backend Services stay ClusterIP with no rule of their own -- the same
# posture as Compose, where 8001 and 8002 are bound to 127.0.0.1 for Swagger and
# nothing else.
